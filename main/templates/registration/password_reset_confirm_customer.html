{% if validlink %}
  <h2>Set New Password</h2>
  <form method="POST">
    {% csrf_token %}
    <input type="password" name="new_password1" placeholder="New password" required><br>
    <input type="password" name="new_password2" placeholder="Confirm password" required><br>
    <input type="hidden" name="email" value="{{ email }}">

    <button type="submit">Reset Password</button>
  </form>
{% else %}
  <p>Password reset link is invalid or has expired. Please try again.</p>
{% endif %}

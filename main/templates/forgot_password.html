{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | Craftoria</title>
    <link rel="stylesheet" href="{% static 'css/admin-style.css' %}"> 
    <style>
       
        body {
            background-color: #f1f1f1;
            font-family: Arial, sans-serif;
        }
        .login-container {
            width: 350px;
            margin: 80px auto;
            padding: 40px;
            background-color: #fff;
            border: 1px solid #ccc;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
        .login-container h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .login-container label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .login-container input[type="email"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background-color: #1e90ff;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        .login-container button:hover {
            background-color: #0d6efd;
        }
        .back-login {
            margin-top: 15px;
            text-align: center;
        }
        .back-login a {
            color: #1e90ff;
            text-decoration: none;
        }
        .back-login a:hover {
            text-decoration: underline;
        }
        .messages {
            margin-bottom: 15px;
            color: red;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h1>Forgot Password</h1>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                {{ message }}
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" action="{% url 'customer_forgot_password' %}">
        {% csrf_token %}
        <label for="email">Enter your email</label>
        <input type="email" name="email" id="email" placeholder="Email" required>
        <button type="submit">Send Reset Link</button>
    </form>

    <div class="back-login">
        <a href="{% url 'custlogin' %}">Back to Login</a>
    </div>
</div>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Sent (Seller)</title>
    
    <link rel="stylesheet" href="{% static 'admin/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'admin/css/forms.css' %}">
    
    <style>
       
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

      
        .full-screen-wrapper {
       display: flex;
       justify-content: center; 
       align-items: flex-start; 
       height: 100%;
       padding: 60px 20px 0 20px; 
      }

      
        .confirmation-container {
            background-color: #fff;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            text-align: center;
            width: 100%;
            max-width: 400px;
            transition: transform 0.3s ease;
        }

        .confirmation-container:hover {
            transform: translateY(-5px);
        }

        h2 {
            color: #0b3d91;
            margin-bottom: 20px;
            font-size: 24px;
        }

        p {
            font-size: 15px;
            margin-bottom: 25px;
            color: #333;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #0b3d91;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #09407e;
        }

        /* Mobile responsiveness */
        @media (max-width: 500px) {
            .confirmation-container {
                padding: 30px 20px;
            }

            h2 {
                font-size: 20px;
            }

            a {
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="full-screen-wrapper">
        <div class="confirmation-container">
            <h2>Check Your Email</h2>
            <p>If an account with that email exists, we have sent a password reset link. Please check your inbox and spam folder.</p>
            <a href="{% url 'sellerlogin' %}">Back to Login</a>
        </div>
    </div>
</body>
</html>

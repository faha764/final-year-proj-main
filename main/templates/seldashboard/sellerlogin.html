{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seller Login</title>
  <style>
    
    * { 
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

       body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background-color: #f8c8c4;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  overflow-y: auto;
}


    .container {
      display: flex;
      width: 850px;
      background: white;
      border-radius: 10px;
      align-items: center;
      overflow: hidden;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }

    .image-section {
      width: 50%;
    }

    .image-section img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .Signup-section {
      width: 50%;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .head-container {
      margin-bottom: 20px;
    }

    .head-container h1 {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
    }

    .form-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
h1{font-size: 20px;
color: #ff2768;}
    .form-container label {
      width: 100%;
      font-weight: bold;
      text-align: left;
      margin-bottom: 5px;
    }
.main-wrapper {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px 0;
}

    .form-container input {
      width: 80%;
      padding: 12px;
      margin-bottom: 5px;
      border: 2px solid #ff2768;
      border-radius: 5px;
      box-shadow: 5px 5px #ffc6c3;
      font-size: 16px;
       overflow-y: auto; 
  height: auto;
  max-height: fit-content;
  overflow: visible;
    }

    .error {
      width: 80%;
      font-size: 13px;
      color: red;
      margin-bottom: 10px;
      text-align: left;
    }

    .password-container {
      width: 80%;
      position: relative;
    }

    .password-container input {
      width: 100%;
      padding-right: 40px;
    }

    .eye-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 16px;
    }

    .signup-btn {
      width: 80%;
      height: 50px;
      font-size: 16px;
      background-color: #ff2768;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: not-allowed;
      box-shadow: 5px 5px black;
      margin-top: 10px;
    }.eye-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 16px;
      color: #555;
    }


    .signup-btn.enabled {
      background-color:  #ff2768;
      cursor: pointer;
    }
  

  </style>
</head>
<body>
  <div class="page-wrapper">
    <main class="main-wrapper">
      <div class="container">
        <div class="image-section">
          <img src="https://images.pexels.com/photos/8801188/pexels-photo-8801188.jpeg?auto=compress&cs=tinysrgb&w=600" />
        </div>

        <div class="Signup-section">
          <div class="head-container">
            {% if messages %}
              {% for message in messages %}
                <p style="color: green;">{{ message }}</p>
              {% endfor %}
            {% endif %}
            <h1>Seller login</h1>
          </div>
          
          <form method="POST" action="{% url 'sellerlogin' %}" class="form-container">
            {% csrf_token %}

            <label>Email</label>
            <input type="email" id="email" name="email" placeholder="Enter Gmail" required />
            <div class="error" id="emailError"></div>

            <label>Password</label>
            <div class="password-container">
              <input type="password" id="password" name="password" placeholder="Enter Password" maxlength="15" required />
                <i class="fa-solid fa-eye eye-icon" id="toggleEye" onclick="togglePassword()"></i>
            </div>
            <div class="error" id="passwordError"></div>

            <a href="{% url 'seller_forgot_password' %}" class="forgot-password" style="display:block; text-align:right; width:80%; margin:5px 0; font-weight:bold; color:#333; text-decoration:none;">Forgot Password?</a>

            <button id="login-btn" class="signup-btn" type="submit" disabled>LOGIN</button>
            <p style="margin-top: 20px; ">Don't have an account? <a href="{% url 'sellersignup' %}" style="color: #ff2768;">Sign Up</a></p>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    function togglePassword() {
    const field = document.getElementById("password");
    const toggle = document.getElementById("toggleEye");
    if (field.type === "password") {
      field.type = "text";
      toggle.classList.remove("fa-eye");
      toggle.classList.add("fa-eye-slash");
    } else {
      field.type = "password";
      toggle.classList.remove("fa-eye-slash");
      toggle.classList.add("fa-eye");
    }
  }

    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");
    const loginBtn = document.getElementById("login-btn");

    function validateForm() {
      let valid = true;


      if (/^\s/.test(email.value)) {
        emailError.textContent = "Email cannot start with space.";
        valid = false;
      } else if (!/^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i.test(email.value.trim())) {
        emailError.textContent = "Invalid email format.";
        valid = false;
      } else {
        emailError.textContent = "";
      }

      
      if (/^\s/.test(password.value)) {
        passwordError.textContent = "Password cannot start with space.";
        valid = false;
      } else if (password.value.length < 8) {
        passwordError.textContent = "Password must be at least 8 characters.";
        valid = false;
      } else {
        passwordError.textContent = "";
      }

     
      loginBtn.disabled = !valid;
      loginBtn.classList.toggle("enabled", valid);
    }

    email.addEventListener("input", validateForm);
    password.addEventListener("input", validateForm);
  </script>
</body>
</html>

<body>
  <div class="container">
    <h2>Manage Order</h2>

   
    <table id="ordersTable">
      <thead>
        <th>Order ID</th>
<th>Customer Name</th>
<th>Address</th>
<th>City</th>

<th>E-mail</th>
<th>Status</th>
<th>Actions</th>
<th>View Orders</th>

      </thead>
      <tbody>

  <script>
   
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

  

   function setupManageOrders() {
   
  fetch('/api/seller/orders/', { credentials: 'same-origin' })


    .then(response => response.json())
    .then(data => {
      window.orders = data;
      renderOrders();
    })
    .catch(error => {
      console.error("Error fetching orders:", error);
      alert("Failed to load orders.");
    });
  }
  
  
  function updateOrderStatus(orderId, newStatus) {
  const csrftoken = getCookie('csrftoken');

  fetch(`/api/seller/orders/${orderId}/update_status/`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': csrftoken, 
    },
    credentials: 'same-origin', 
    body: JSON.stringify({ status: newStatus })
  })
  .then(response => {
    if (!response.ok) throw new Error('Failed to update status');
    return response.json();
  })
  .then(data => {
    alert("Order updated to: " + data.new_status);
    setupManageOrders();
  })
  .catch(error => {
    console.error("Error updating status:", error);
    alert("Status update failed.");
  });
}



function notifyAdmin(orderId) {
  alert(`Notify admin to release payment of order ${orderId}`);
  
}

function renderOrders() {
  const ordersTableBody = document.querySelector("#ordersTable tbody");
  ordersTableBody.innerHTML = "";

orders
  .sort((a, b) => b.id - a.id) 
  .forEach(order => {

    console.log("Order ID:", order.id, "Status:", order.status);

    const shipping = order.shipping;
    const status = order.status.toLowerCase(); 

    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${order.id}</td>
      <td>${shipping.full_name}</td>
      <td>${shipping.address}</td>
      <td>${shipping.city}</td>
      <td>${shipping.phone}</td>
      <td>${shipping.email}</td>
      <td>${order.status}</td>
 <td>
  ${
    status === "confirmed"
      ? `<button onclick="updateOrderStatus(${order.id}, 'shipping')">Mark as Shipping</button>`
      : status === "shipping"
      ? `<button onclick="updateOrderStatus(${order.id}, 'delivered')">Mark as Delivered</button>`
      
      
      : (status === "cancelled" || status === "cancelled by admin")
      ? `<span style="color:green;">Order Cancelled (No action needed)</span>`
      : status === "payment re-upload requested"
      ? `<span style="color:orange;">Wait for Admin Confirmation</span>`
      : `<button disabled style="background:#ccc; cursor:not-allowed;">Ship</button>`
  }
</td>



      <td>
        <button onclick="viewOrder(${order.id})">View</button>
      </td>
    `;
    ordersTableBody.appendChild(row);
  });
}


 function viewOrder(orderId) {
  fetch(`/api/seller/orders/${orderId}/details/`)

    .then(response => response.json())
    .then(data => {
      const { items } = data;  

      let content = `
        <h4>Order Items</h4>
      `;

      items.forEach(item => {
        content += `
          <div style="margin-bottom:15px;">
            <img src="${item.image}" style="width:80px; height:80px; object-fit:cover; border-radius:5px;">
            <div><strong>${item.name}</strong></div>
            <div>Quantity: ${item.quantity}</div>
            <div>Total Price: PKR ${item.total_price}</div>
          </div>
          <hr>
        `;
      });

      document.getElementById("orderDetailsContent").innerHTML = content;
      document.getElementById("orderModal").style.display = "block";
    })
    .catch(error => {
      console.error("Error loading order detail:", error);
      alert("Failed to load order details.");
    });
}

  function closeModal() {
    document.getElementById("orderModal").style.display = "none";
  }

function closeModal() {
  document.getElementById("orderModal").style.display = "none";
}




  setupManageOrders();

  </script>

    </div>

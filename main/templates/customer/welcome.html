{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Craftify</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url("{% static 'images/bg.jpeg' %}") no-repeat center center/cover;
      position: relative;
      color: white;
      text-align: center;
    }

    
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.55);
    }

    .welcome-content {
      position: relative;
      z-index: 2;
      max-width: 700px;
      padding: 40px;
      animation: fadeIn 1.5s ease-in-out;
    }

    .logo {
      width: 120px;
      height: auto;
      margin-bottom: 20px;
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .welcome-content h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: white;
      text-shadow: 0 4px 8px rgba(0,0,0,0.7);
    }

    .welcome-content p {
      font-size: 1.2rem;
      margin-bottom: 40px;
      line-height: 1.6;
      color: white;
    }

    .btn {
      display: inline-block;
      padding: 14px 30px;
      border-radius: 40px;
      background: linear-gradient(135deg, #ff2768, #ff2768);
      color: white;
      font-size: 1.1rem;
      text-decoration: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.6);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="welcome-content">
   
    <img src="{% static 'images/logo.jpeg' %}" alt="Craftify Logo" class="logo">

    <h1> Welcome to Craftify </h1>
    <p>Craftify is all about creativity. Explore, design, and enjoy unique handmade products.</p>

    <a href="{% url 'homeee' %}" class="btn">Enter Craftify</a>
  </div>
</body>
</html>

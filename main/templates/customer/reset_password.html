{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Reset Password</title>
    <link rel="stylesheet" href="{% static 'admin/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'admin/css/forms.css' %}">
    <style>
        body {
            background-color: #f1f1f1;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        .reset-container {
            width: 400px;
            margin: 80px auto;
            padding: 40px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff2768;
        }
        input[type=password], button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 14px;
        }
        button {
            background-color: #ff2768;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #ff2768;
        }
        .message {
            text-align: center;
            margin-bottom: 10px;
            color: red;
        }
        .success {
            color: green;
        }
        .password-container {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #ff2768;
            font-weight: bold;
            font-size: 12px;
        }
        a.back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #ff2768;
            text-decoration: none;
        }
        a.back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <h2>Set a New Password</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="message {% if message.tags %}{{ message.tags }}{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="password-container">
                <input type="password" id="new_password" name="password" placeholder="New Password" required>
                <span class="toggle-password" onclick="togglePassword('new_password')">Show</span>
            </div>
            <div class="password-container">
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
                <span class="toggle-password" onclick="togglePassword('confirm_password')">Show</span>
            </div>
            <button type="submit">Reset Password</button>
        </form>

        <a class="back-link" href="{% url 'custlogin' %}">Back to Login</a>
    </div>

    <script>
        function togglePassword(fieldId) {
            const input = document.getElementById(fieldId);
            const toggle = input.nextElementSibling;
            if (input.type === "password") {
                input.type = "text";
                toggle.textContent = "Hide";
            } else {
                input.type = "password";
                toggle.textContent = "Show";
            }
        }

        
        const form = document.querySelector("form");
        form.addEventListener("submit", function(e) {
            const pw1 = document.getElementById("new_password").value;
            const pw2 = document.getElementById("confirm_password").value;
            if (pw1 !== pw2) {
                alert("Passwords do not match!");
                e.preventDefault();
            }
        });
    </script>
</body>
</html>

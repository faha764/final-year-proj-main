{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Sent | Craftoria</title>
    <link rel="stylesheet" href="{% static 'css/admin-style.css' %}"> 
    <style>
       
        body {
            background-color: #f1f1f1;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 400px;
            margin: 100px auto;
            padding: 40px;
            background-color: #fff;
            border: 1px solid #ccc;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            margin-bottom: 30px;
        }
        .back-login a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ff2768;
            color: #fff;
            text-decoration: none;
            border-radius: 3px;
            font-weight: bold;
        }
        .back-login a:hover {
            background-color: #ff2768;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Password Reset Link Sent</h1>
    <p>A password reset link has been sent. Please check your inbox and follow the instructions to reset your password.</p>

    <div class="back-login">
        <a href="{% url 'custlogin' %}" style="color: white;">Back to Login</a>
    </div>
</div>

</body>
</html>

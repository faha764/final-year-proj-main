<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Admin Login</title>
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }
    body {
        background-color: #ffc6c3;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .container {
        display: flex;
        width: 850px;
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }
    .image-section {
        width: 50%;
    }
    .image-section img {
        background-image: url("https://images.pexels.com/photos/10581780/pexels-photo-10581780.jpeg?auto=compress&cs=tinysrgb&w=600");
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .login-section {
        width: 50%;
        padding: 30px;
        text-align: left;
    }
    h1 {
        font-size: 25px;
        color: #ff2768;
        font-weight: bold;
        text-align: center;
        margin-bottom: 10px;
    }
    p {
        color: gray;
        font-size: 14px;
        margin-bottom: 15px;
    }
    label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
    }
    input {
    width: 100%;
    padding: 12px;
    margin-bottom: 5px;
    border: 2px solid #ff2768;
    border-radius: 5px;
    box-shadow: 5px 5px #ffc6c3;
    display: block;
    font-size: 16px;
}

.password-container {
    position: relative;
    width: 100%; 
}

.eye-icon {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
    color: black;
}


    .forgot-password {
        background: white;
        font-size: 16px;
        font-weight: bold;
        text-align: center;
        color: black;
        text-decoration: none;
        cursor: pointer;
    }
    button {
        width: 100%;
        padding: 10px;
        background: #ff2768;
        border: 1px solid black;
        border-radius: 5px;
        box-shadow: 5px 5px black;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 5px;
        display: block;
        color: white;
    }
    button:hover {
        background-color: #ff2768;
        color: white;
    }
    a {
        text-decoration: none;
        color: #ff2768;
        font-weight: bold;
    }
    p {
        text-align: center;
        margin-top: 10px;
    }
    .eye-icon {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

    .text-section {
        display: none;
    }
</style>

<body>
    <div class="container">
        <div class="image-section">
            <img src="https://images.pexels.com/photos/8801188/pexels-photo-8801188.jpeg?auto=compress&cs=tinysrgb&w=600">
        </div>

        <div class="login-section">
            <h1>Admin Login</h1>
        <form method="POST" action="{% url 'Adminlogin' %}">
            {% csrf_token %}                
                <label>Email</label>
<input type="email" id="adminEmail" name="email" placeholder="Enter Gmail" required>

<label>Password</label>
<div class="password-container">
  <input type="password" id="adminPassword" name="password" placeholder="Enter your password" required>
  <i id="toggleAdminEye" class="fa-solid fa-eye eye-icon" onclick="toggleAdminPassword()"></i>
</div>


            {% if form.password.errors %}
  <div class="error">{{ form.password.errors.0 }}</div>
{% endif %}

  
  {% if error %}
    <p style="color: red; margin-top: 10px;">{{ error }}</p>
  {% endif %}

  
<a href="{% url 'admin_forgot_password' %}" class="forgot-password">Forgot Password?</a>

                <button type="submit">Login</button>
                <p><a href="admindashboard.html"></a></p>
            </form>
        </div>
    </div>

    <script>
       function toggleAdminPassword() {
    const field = document.getElementById("adminPassword");
    const toggle = document.getElementById("toggleAdminEye");

    if (field.type === "password") {
        field.type = "text";
        toggle.classList.remove("fa-eye");
        toggle.classList.add("fa-eye-slash"); 
    } else {
        field.type = "password";
        toggle.classList.remove("fa-eye-slash");
        toggle.classList.add("fa-eye");
    }
}
document.getElementById("adminEmail").addEventListener("input", function() {
    this.value = this.value.replace(/^\s+/, ""); 
});

document.getElementById("adminPassword").addEventListener("input", function() {
    this.value = this.value.replace(/^\s+/, "");
});



        

    </script>
</body>
</html>

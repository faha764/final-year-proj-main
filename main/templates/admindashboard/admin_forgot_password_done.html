{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Sent</title>
    
    <link rel="stylesheet" href="{% static 'admin/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'admin/css/dashboard.css' %}">
    <style>
        body {
            background-color: #f1f1f1;
        }
        .container {
            max-width: 500px;
            margin: 80px auto;
            padding: 30px;
            background-color: #fff;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h2 {
            color: #ff2768; 
            text-align: center;
            margin-bottom: 20px;
        }
        p {
            text-align: center;
            font-size: 16px;
        }
        .back-btn {
            display: block;
            width: 50%;
            margin: 20px auto 0 auto;
            padding: 10px 0;
            text-align: center;
            background-color: #ff2768;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #ff2768;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Password Reset Link Sent</h2>
        <p>A password reset link has been sent.
        Please check your inbox and follow the instructions to reset your password.</p>
        <a href="{% url 'Adminlogin' %}" class="back-btn" style="color: white;">Back to Login</a>
    </div>
</body>
</html>

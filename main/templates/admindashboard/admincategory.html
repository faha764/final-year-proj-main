<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Category Management</title>
  <style>
   

    .container {
      max-width: 600px;
      margin: auto;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
      color: #ff2768;
    }

    input, button {
      padding: 10px;
      margin: 10px 0;
      width: 100%;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .btn {
      background-color: #ff2768;
      color: white;
      border: none;
      cursor: pointer;
      width:20%;
    }

    .btn-del {
    width: 60px; 
    background-color: #ff2768;
    color: white;
    padding: 5px;
    border: none;
    border-radius: 5px;
}
    .btn:hover {
      background-color: #e01f5b;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #ffeef0;
      margin: 10px 0;
      padding: 10px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .actions button {
      margin: 5px;
    }

    .edit-input {
      width: 60%;
    }

    a.category-link {
      text-decoration: none;
      color: #ff2768;
      font-weight: bold;
    }

    a.category-link:hover {
      text-decoration: underline;
    }
      .message-success {
    color: green;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .message-error {
    color: green;
    font-weight: bold;
    margin-bottom: 10px;
  }
  </style>
</head>
<body>
  <div class="container">
    <h1>Category Management</h1>
    {% if messages %}
  {% for message in messages %}
    <div class="message-{{ message.tags }}">{{ message }}</div>
  {% endfor %}
{% endif %}

    <form method="post" action="{% url 'admincategory' %}">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Add Category</button>
    </form>

    <input type="text" id="searchInput" placeholder="Search Category..." onkeyup="searchCategory()">

    <ul id="categoryList">
     {% for category in categories %}
    <li>
      
      <a href="{% url 'admin_category_products' category.id %}" class="category-link">
  {{ category.name }}
</a>


      
      <div class="actions">
        <form method="post" action="{% url 'delete_category' category.id %}" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this category?');">
          {% csrf_token %}
          <button class="btn-del" type="submit">Delete</button>
        </form>

         <a href="{% url 'edit_category' category.id %}" class="btn-del" style="background:#ff2768;">Edit</a>
  
      </div>
    </li>
{% empty %}
    <li>No categories found.</li>
{% endfor %}

    </ul>
  </div>

  <script>
    function searchCategory() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const items = document.querySelectorAll("#categoryList li");

      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(search) ? "" : "none";
      });
    }
  </script>
</body>
</html>
